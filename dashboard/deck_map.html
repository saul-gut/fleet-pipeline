<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Mapa del dashboard (D-21, D-23): deck.gl en el navegador, versión fijada. -->
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.3.11/dist.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#3a3a3a; overflow:hidden;
    font-family:'Inter', system-ui, sans-serif; }
  #map { position:absolute; inset:0; }
  .glass { background:rgba(15,20,28,.82); border:1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(10px); box-shadow:0 10px 30px -12px rgba(0,0,0,.8); }
  .legend { position:absolute; left:14px; bottom:14px; z-index:2; width:220px;
    padding:12px 14px; border-radius:14px; color:#d6dbe3; font-size:11.5px; }
  .legend h5 { margin:0 0 6px; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:#9aa3b2; font-weight:600; }
  .legend .row { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .legend .sw { width:14px; height:14px; border-radius:3px; flex:none; }
  .legend .line { width:18px; height:3px; border-radius:2px; flex:none; }
  .legend .dash { width:18px; height:0; border-top:3px dashed; flex:none; }
  .legend .ramp { height:8px; border-radius:999px; margin:4px 0 2px; }
  .legend .ends { display:flex; justify-content:space-between; color:#9aa3b2; font-size:10px; }
  .legend section + section { margin-top:9px; padding-top:8px; border-top:1px solid rgba(255,255,255,.07); }
  .top-left { position:absolute; top:14px; left:14px; z-index:2; }
  .tag { padding:7px 12px; border-radius:999px; font-size:11.5px; font-weight:600; color:#f0efec; display:inline-block; }
  .tag .live { display:inline-block; width:7px; height:7px; border-radius:50%; background:#22c55e;
    margin-right:7px; box-shadow:0 0 10px #22c55e; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .layers { position:absolute; top:14px; right:14px; z-index:2; padding:10px 12px; border-radius:14px;
    color:#eef2f7; font-size:12px; width:178px; }
  .layers h5 { margin:0 0 6px; font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:#9aa3b2; font-weight:600; }
  .layers label { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; user-select:none; }
  .layers input { accent-color:#22c55e; width:14px; height:14px; cursor:pointer; }
  .seg { display:flex; margin-top:8px; border-radius:9px; overflow:hidden; border:1px solid rgba(255,255,255,.14); }
  .seg button, .fit { all:unset; cursor:pointer; flex:1; text-align:center; padding:6px 0; font-size:11.5px;
    font-weight:600; color:#c8d0dc; transition: background .2s, color .2s; }
  .seg button.active { background:rgba(34,197,94,.28); color:#fff; }
  .fit { display:block; margin-top:8px; border-radius:9px; border:1px solid rgba(255,255,255,.14); }
  .fit:hover, .seg button:hover { background:rgba(34,197,94,.16); color:#fff; }
  .loader { position:absolute; left:50%; top:62px; transform:translateX(-50%); z-index:3; width:260px;
    padding:10px 14px 12px; border-radius:12px; color:#d6dbe3; font-size:11.5px;
    opacity:0; transition: opacity .35s ease; pointer-events:none; }
  .loader.on { opacity:1; }
  .loader .track { height:4px; border-radius:999px; background:rgba(255,255,255,.08); margin-top:7px; overflow:hidden; }
  .loader .fill { height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#22c55e,#86efac);
    box-shadow:0 0 12px #22c55e; transition: width .25s ease; }
  .attribution { position:absolute; right:10px; bottom:6px; z-index:2; font-size:10px; color:#c3c8d0;
    text-shadow:0 1px 2px #000; }
  .attribution a { color:#c3c8d0; }
</style>
</head>
<body>
<div id="map"></div>
<div class="top-left"><span class="tag glass" id="title"></span></div>
<div class="layers glass" id="layers"></div>
<div class="loader glass" id="loader"><span id="loader-text">Cargando mapa base…</span>
  <div class="track"><div class="fill" id="loader-fill"></div></div></div>
<div class="legend glass" id="legend"></div>
<div class="attribution">Mapa base: Esri, HERE, Garmin, © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> y la comunidad de usuarios GIS</div>
<script>
const DATA = __DATA__;

const {Deck, TileLayer, BitmapLayer, GeoJsonLayer, PathLayer, ScatterplotLayer, IconLayer,
       HeatmapLayer, HexagonLayer, TripsLayer, FillStyleExtension, PathStyleExtension,
       FlyToInterpolator, WebMercatorViewport} = deck;

const rgb = (hex, a = 255) => {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), a];
};
const SPECIAL = new Set(['school', 'high_risk', 'road_hazard']);
const zoneColor = (z, a) => rgb(DATA.zones.colors[z] || '#898781', a);
const sevColor = (s, a) => rgb(DATA.severity.colors[s] || '#3987e5', a);
const fmtTime = (iso) => new Date(iso).toLocaleString('es-CO', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
// Todo texto que viene de la base se escapa antes de insertarlo en el HTML (defensa en profundidad).
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

// Estado de las capas: se cambia dentro del mapa, sin volver a ejecutar Streamlit.
const show = {geofences: true, routes: true, infractions: true, alerts: true};
let mode = DATA.mode;

// --- Patrones de achurado (codificación secundaria de cada zona) ---------------------------
const PATTERN_SIZE = 32;
function patternAtlas() {
  const c = document.createElement('canvas');
  c.width = PATTERN_SIZE * 3; c.height = PATTERN_SIZE;
  const g = c.getContext('2d');
  g.strokeStyle = '#fff'; g.lineWidth = 2.5;
  const lines = (ox, direction) => {
    g.save(); g.beginPath(); g.rect(ox, 0, PATTERN_SIZE, PATTERN_SIZE); g.clip();
    for (let k = -PATTERN_SIZE; k <= PATTERN_SIZE * 2; k += 9) {
      g.beginPath();
      if (direction > 0) { g.moveTo(ox + k, PATTERN_SIZE); g.lineTo(ox + k + PATTERN_SIZE, 0); }
      else { g.moveTo(ox + k, 0); g.lineTo(ox + k + PATTERN_SIZE, PATTERN_SIZE); }
      g.stroke();
    }
    g.restore();
  };
  lines(0, 1);                                              // diag: 45°
  lines(PATTERN_SIZE, -1);                                  // anti: 135°
  lines(PATTERN_SIZE * 2, 1); lines(PATTERN_SIZE * 2, -1);  // cross: cuadriculado
  return c.toDataURL();
}
const PATTERN_ATLAS = patternAtlas();
const PATTERN_MAPPING = {
  diag: {x: 0, y: 0, width: PATTERN_SIZE, height: PATTERN_SIZE, mask: true},
  anti: {x: PATTERN_SIZE, y: 0, width: PATTERN_SIZE, height: PATTERN_SIZE, mask: true},
  cross: {x: PATTERN_SIZE * 2, y: 0, width: PATTERN_SIZE, height: PATTERN_SIZE, mask: true},
};
const ARROW_ICON = 'data:image/svg+xml;base64,' + btoa(
  '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">'
  + '<path d="M32 6 L54 50 L32 38 L10 50 Z" fill="#fff"/></svg>');
const ARROW_MAPPING = {arrow: {x: 0, y: 0, width: 64, height: 64, mask: true}};

// --- Datos que no cambian entre cuadros (mismas referencias = sin recálculo en deck.gl) ---
const specialZones = DATA.geofences.filter(f => SPECIAL.has(f.properties.zone_type));
const contextZones = DATA.geofences.filter(f => !SPECIAL.has(f.properties.zone_type));
const heatRamp = DATA.heatRamp.map(c => rgb(c).slice(0, 3));
const route = DATA.route;                     // un vehículo en detalle
const fleet = route ? null : DATA.fleet;      // toda la flota (vista general)
const detailTrip = route && route.trip.path.length ? [route.trip] : [];
const tripData = route ? detailTrip : (fleet ? fleet.vehicles : []);
const tripEnd = route ? (detailTrip.length ? detailTrip[0].timestamps.at(-1) : 0) : (fleet ? fleet.end : 0);

// --- Carga de teselas con avance real ------------------------------------------------------
const loader = {inflight: 0, done: 0, hideTimer: null};
function updateLoader() {
  const total = loader.inflight + loader.done;
  document.getElementById('loader-fill').style.width = total ? `${100 * loader.done / total}%` : '0';
  document.getElementById('loader-text').textContent =
    `Cargando mapa base · ${loader.done} de ${total} teselas`;
  const el = document.getElementById('loader');
  clearTimeout(loader.hideTimer);
  if (loader.inflight > 0) { el.classList.add('on'); }
  else { loader.hideTimer = setTimeout(() => { el.classList.remove('on'); loader.done = 0; }, 450); }
}
function loadTile({url, signal}) {
  loader.inflight++; updateLoader();
  return fetch(url, {signal})
    .then(r => (r.ok ? r.blob() : null))
    .then(b => (b ? createImageBitmap(b) : null))
    .catch(() => null)
    .finally(() => { loader.inflight--; loader.done++; updateLoader(); });
}

// Mapa base: Esri World Dark Gray Canvas (D-22) en su gris original, sin clave, con atribución.
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas';
const esriLayer = (id, service) => new TileLayer({
  id, data: `${ESRI}/${service}/MapServer/tile/{z}/{y}/{x}`,
  minZoom: 0, maxZoom: 16, tileSize: 256, maxRequests: 16, getTileData: loadTile,
  renderSubLayers: props => {
    if (!props.data) return null;
    const [[west, south], [east, north]] = props.tile.boundingBox;
    return new BitmapLayer(props, {data: null, image: props.data, bounds: [west, south, east, north]});
  }
});
const basemap = esriLayer('basemap', 'World_Dark_Gray_Base');
const labels = esriLayer('labels', 'World_Dark_Gray_Reference');

// --- Capas de datos --------------------------------------------------------------------
function geofenceLayers() {
  if (!show.geofences) return [];
  return [
    new GeoJsonLayer({
      id: 'context-zones', data: contextZones, filled: false, stroked: true,
      getLineColor: f => zoneColor(f.properties.zone_type, 170), lineWidthMinPixels: 1,
    }),
    // Achurado: líneas en lugar de relleno sólido; el mapa se sigue viendo debajo.
    new GeoJsonLayer({
      id: 'zones-hatch', data: specialZones, filled: true, stroked: false,
      getFillColor: f => zoneColor(f.properties.zone_type, 170),
      extensions: [new FillStyleExtension({pattern: true})],
      fillPatternAtlas: PATTERN_ATLAS, fillPatternMapping: PATTERN_MAPPING, fillPatternMask: true,
      getFillPattern: f => DATA.zones.patterns[f.properties.zone_type],
      getFillPatternScale: 0.55, getFillPatternOffset: [0, 0],
    }),
    new GeoJsonLayer({
      id: 'zones-halo', data: specialZones, filled: false, stroked: true,
      getLineColor: f => zoneColor(f.properties.zone_type, 70), lineWidthMinPixels: 7,
    }),
    new GeoJsonLayer({
      id: 'special-zones', data: specialZones, filled: true, stroked: true, pickable: true,
      getFillColor: f => zoneColor(f.properties.zone_type, 14),
      getLineColor: f => zoneColor(f.properties.zone_type, 240), lineWidthMinPixels: 1.6,
      autoHighlight: true, highlightColor: [255, 255, 255, 25],
    }),
  ];
}

function infractionLayers() {
  if (!show.infractions || !DATA.infractions.length) return [];
  if (mode === 'hexagon') {
    return [new HexagonLayer({
      id: 'hexagons', data: DATA.infractions, getPosition: d => d.p,
      radius: 220, elevationScale: 6, extruded: true, coverage: 0.88,
      colorRange: heatRamp, upperPercentile: 99, pickable: true,
      material: {ambient: 0.6, diffuse: 0.6, shininess: 40},
    })];
  }
  return [new HeatmapLayer({
    id: 'heatmap', data: DATA.infractions, getPosition: d => d.p,
    getWeight: d => Math.max(1, d.w), radiusPixels: 38, intensity: 1.2, threshold: 0.04,
    colorRange: heatRamp,
  })];
}

function trailLayer(t) {
  return new TripsLayer({
    id: 'trips', data: tripData, getPath: d => d.path, getTimestamps: d => d.timestamps,
    getColor: route ? [190, 228, 255] : [120, 220, 255], opacity: 1,
    widthMinPixels: route ? 5 : 3.5, capRounded: true, jointRounded: true,
    trailLength: tripEnd / (route ? 9 : 24), currentTime: t * tripEnd, fadeTrail: true,
  });
}

function fleetLayers(t) {
  // Vista general: los recorridos de toda la flota (finos) y sus estelas animadas a la vez.
  if (!show.routes || !fleet) return [];
  return [
    new PathLayer({
      id: 'fleet-paths', data: fleet.vehicles, getPath: d => d.path, pickable: true,
      getColor: [57, 135, 229, 120], widthMinPixels: 1.6, jointRounded: true,
      autoHighlight: true, highlightColor: [156, 199, 255, 255],
    }),
    trailLayer(t),
  ];
}

function routeLayers(t) {
  // Un vehículo en detalle: tramos por severidad, línea segmentada, flechas y estela.
  if (!show.routes || !route) return [];
  return [
    new PathLayer({
      id: 'route-halo', data: route.segments, getPath: d => d.path,
      getColor: d => rgb(d.color, 55), widthMinPixels: 10, capRounded: true, jointRounded: true,
    }),
    new PathLayer({
      id: 'route', data: route.segments, getPath: d => d.path, pickable: true,
      getColor: d => rgb(d.color, 240), widthMinPixels: 3, capRounded: true,
      extensions: [new PathStyleExtension({dash: true})],
      getDashArray: [5, 3], dashJustified: true, dashGapPickable: true,
    }),
    new IconLayer({
      id: 'route-arrows-shadow', data: route.arrows, getPosition: d => d.p,
      iconAtlas: ARROW_ICON, iconMapping: ARROW_MAPPING, getIcon: () => 'arrow',
      getSize: 24, sizeUnits: 'pixels', getAngle: d => -d.bearing, getColor: [8, 11, 18, 235],
    }),
    new IconLayer({
      id: 'route-arrows', data: route.arrows, getPosition: d => d.p,
      iconAtlas: ARROW_ICON, iconMapping: ARROW_MAPPING, getIcon: () => 'arrow',
      getSize: 17, sizeUnits: 'pixels', getAngle: d => -d.bearing,
      getColor: d => rgb(d.color, 255),
    }),
    trailLayer(t),
  ];
}

function alertLayers(t) {
  if (!show.alerts || !DATA.alerts.length) return [];
  return [
    // Anillo que se expande y se desvanece: cada alerta "late" con un desfase propio.
    new ScatterplotLayer({
      id: 'alert-pulse', data: DATA.alerts, getPosition: d => d.p,
      stroked: true, filled: false, radiusUnits: 'pixels', lineWidthUnits: 'pixels',
      getRadius: d => 6 + 22 * ((t * 6 + d.phase) % 1),
      getLineColor: d => sevColor(d.sev, Math.round(220 * (1 - ((t * 6 + d.phase) % 1)))),
      getLineWidth: 2,
      updateTriggers: {getRadius: t, getLineColor: t},
    }),
    new ScatterplotLayer({
      id: 'alerts', data: DATA.alerts, getPosition: d => d.p, pickable: true,
      radiusUnits: 'pixels', getRadius: 5, getFillColor: d => sevColor(d.sev, 255),
      stroked: true, getLineColor: [7, 9, 13, 255], lineWidthUnits: 'pixels', getLineWidth: 1.5,
    }),
  ];
}

// --- Tooltips ---------------------------------------------------------------------------
function tooltip({object, layer}) {
  if (!object) return null;
  const box = html => ({html, style: {
    background: 'rgba(15,20,28,.95)', color: '#f0efec', border: '1px solid rgba(255,255,255,.12)',
    borderRadius: '10px', padding: '9px 11px', fontSize: '12px', fontFamily: 'Inter, sans-serif',
    boxShadow: '0 10px 30px -10px rgba(0,0,0,.9)', maxWidth: '260px'}});
  if (layer.id === 'special-zones') {
    const p = object.properties;
    return box(`<b>${esc(p.name)}</b><br>${DATA.zones.labels[p.zone_type]} · límite <b>${p.speed_limit_kmh} km/h</b>`
      + `<br><span style="color:#9aa3b2">${p.limit_source === 'law' ? 'Ley 2251 de 2022' : 'Política de la flota'}</span>`);
  }
  if (layer.id === 'fleet-paths') {
    return box(`<span style="font-family:'JetBrains Mono'">${esc(object.label)}</span>`
      + `<br><span style="color:#9aa3b2">Elige este vehículo en el panel para ver su ruta en detalle</span>`);
  }
  if (layer.id === 'route') {
    const over = object.severity ? ` · <span style="color:${DATA.severity.colors[object.severity]}">${DATA.severity.labels[object.severity]}</span>` : '';
    return box(`<b>${fmtTime(object.ts)}</b>${over}<br>${object.speed.toFixed(0)} km/h · límite ${object.limit} km/h`
      + `<br><span style="color:#9aa3b2">${DATA.zones.labels[object.zone] || 'Sin geocerca'}</span>`);
  }
  if (layer.id === 'alerts') {
    return box(`<b>${object.type}</b> · <span style="color:${DATA.severity.colors[object.sev]}">${DATA.severity.labels[object.sev]}</span>`
      + `<br><span style="font-family:'JetBrains Mono'">${esc(object.label)}</span> · ${fmtTime(object.ts)}`
      + `<br>máx. ${object.speed.toFixed(0)} km/h en zona de ${object.limit} km/h`);
  }
  if (layer.id === 'hexagons') return box(`<b>${object.count}</b> lecturas en infracción`);
  return null;
}

// --- Leyenda y panel de capas ------------------------------------------------------------
const HATCH_CSS = {
  diag: c => `repeating-linear-gradient(-45deg, ${c} 0 2px, transparent 2px 5px)`,
  anti: c => `repeating-linear-gradient(45deg, ${c} 0 2px, transparent 2px 5px)`,
  cross: c => `repeating-linear-gradient(45deg, ${c} 0 1.5px, transparent 1.5px 5px), repeating-linear-gradient(-45deg, ${c} 0 1.5px, transparent 1.5px 5px)`,
};
function renderLegend() {
  const z = DATA.zones, s = DATA.severity;
  let html = '';
  if (show.geofences) {
    const zoneRows = ['school', 'high_risk', 'road_hazard'].map(k =>
      `<div class="row"><span class="sw" style="background:${HATCH_CSS[z.patterns[k]](z.colors[k])};border:1px solid ${z.colors[k]}"></span>${z.labels[k]}</div>`).join('');
    const ctxRows = ['urban', 'highway'].map(k =>
      `<div class="row"><span class="line" style="background:${z.colors[k]}"></span>${z.labels[k]}</div>`).join('');
    html += `<section><h5>Geocercas</h5>${zoneRows}${ctxRows}</section>`;
  }
  if (show.routes && route) {
    const sevRows = ['minor', 'moderate', 'severe'].map(k =>
      `<div class="row"><span class="dash" style="border-color:${s.colors[k]}"></span>Exceso ${s.labels[k].toLowerCase()}</div>`).join('');
    html += `<section><h5>Ruta · ${esc(route.label)}</h5>`
      + `<div class="row"><span class="dash" style="border-color:#3987e5"></span>Dentro del límite</div>${sevRows}`
      + `<div class="row"><span style="color:#9cc7ff;width:18px;text-align:center">▲</span>Sentido de avance</div></section>`;
  } else if (show.routes && fleet) {
    html += `<section><h5>Flota · ${fleet.vehicles.length} vehículos</h5>`
      + `<div class="row"><span class="line" style="background:#3987e5"></span>Recorridos del periodo</div>`
      + `<div class="row"><span class="line" style="background:#78dcff;box-shadow:0 0 6px #78dcff"></span>Movimiento (animado)</div></section>`;
  }
  if (show.infractions) {
    html += `<section><h5>${mode === 'hexagon' ? 'Infracciones (hexágonos 3D)' : 'Densidad de infracciones'}</h5>`
      + `<div class="ramp" style="background:linear-gradient(90deg,${DATA.heatRamp.join(',')})"></div>`
      + `<div class="ends"><span>baja</span><span>alta</span></div></section>`;
  }
  const legend = document.getElementById('legend');
  legend.innerHTML = html;
  legend.style.display = html ? 'block' : 'none';
}

function renderLayerPanel() {
  const items = [
    ['geofences', 'Geocercas'],
    ['routes', route ? 'Ruta del vehículo' : 'Recorridos de la flota'],
    ['infractions', 'Infracciones'],
    ['alerts', 'Alertas que pulsan'],
  ];
  document.getElementById('layers').innerHTML = '<h5>Capas</h5>'
    + items.map(([k, label]) => `<label><input type="checkbox" data-layer="${k}" ${show[k] ? 'checked' : ''}>${label}</label>`).join('')
    + `<div class="seg"><button data-mode="heatmap" class="${mode === 'heatmap' ? 'active' : ''}">Heatmap</button>`
    + `<button data-mode="hexagon" class="${mode === 'hexagon' ? 'active' : ''}">Hexágonos 3D</button></div>`
    + `<button class="fit" id="fit">⤢ Encuadrar datos</button>`;
  document.querySelectorAll('#layers input').forEach(i => i.onchange = () => {
    show[i.dataset.layer] = i.checked; renderLegend();
  });
  document.querySelectorAll('#layers .seg button').forEach(b => b.onclick = () => {
    mode = b.dataset.mode; renderLayerPanel(); renderLegend(); fit(true);
  });
  document.getElementById('fit').onclick = () => fit(true);
}

// --- Encuadre automático en lo que está filtrado ---------------------------------------------
const map = document.getElementById('map');
function dataBounds() {
  const pts = [];
  if (route) pts.push(...route.trip.path);
  else if (fleet) fleet.vehicles.forEach(v => pts.push(...v.path));
  DATA.alerts.forEach(a => pts.push(a.p));
  if (!pts.length) DATA.geofences.forEach(f => f.geometry.coordinates.forEach(poly => pts.push(...poly[0])));
  if (!pts.length) return null;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return [[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]];
}
function targetView() {
  const bounds = dataBounds();
  const tilt = mode === 'hexagon' ? {pitch: 50, bearing: -18} : {pitch: 0, bearing: 0};
  if (!bounds) return {longitude: -74.1, latitude: 4.65, zoom: 10.5, ...tilt};
  const vp = new WebMercatorViewport({width: map.clientWidth || 1000, height: map.clientHeight || 600});
  const {longitude, latitude, zoom} = vp.fitBounds(bounds, {padding: {top: 70, bottom: 40, left: 250, right: 210}});
  return {longitude, latitude, zoom: Math.min(zoom, 14.5), ...tilt};
}
function fit(animated) {
  deckgl.setProps({initialViewState: {...targetView(),
    ...(animated ? {transitionDuration: 1400, transitionInterpolator: new FlyToInterpolator({speed: 1.8})} : {})}});
}

const deckgl = new Deck({
  parent: map,
  initialViewState: targetView(),
  controller: true,
  getTooltip: tooltip,
  layers: [],
});

// --- Animación ------------------------------------------------------------------------
const LOOP_MS = 25000;
const started = performance.now();
function frame(now) {
  const t = ((now - started) % LOOP_MS) / LOOP_MS;
  // De abajo hacia arriba: fondo, geocercas, infracciones, etiquetas, recorridos y alertas.
  deckgl.setProps({layers: [basemap, ...geofenceLayers(), ...infractionLayers(), labels,
                            ...fleetLayers(t), ...routeLayers(t), ...alertLayers(t)]});
  requestAnimationFrame(frame);
}
document.getElementById('title').innerHTML = `<span class="live"></span>${esc(DATA.title)}`;
renderLegend();
renderLayerPanel();
requestAnimationFrame(frame);
</script>
