name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # PostGIS real como servicio: los tests de integración corren contra la misma imagen de Docker Compose.
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fleet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Credenciales de prueba, solo válidas dentro de este job efímero.
    env:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: fleet
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      API_KEY_DEVICE: ci_device_key
      API_KEY_ADMIN: ci_admin_key
      API_KEY_ANALYST: ci_analyst_key
      PGPASSWORD: ci_password

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias (versiones fijadas en uv.lock)
        run: |
          pip install uv
          uv sync --locked

      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Lo mismo que hace Docker Compose al crear el volumen: db/init en orden alfabético.
      - name: Inicializar PostGIS con db/init
        run: |
          for f in db/init/*.sql; do
            echo "::group::$f"
            psql -h localhost -U fleet -d fleet -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
          psql -h localhost -U fleet -d fleet -tAc "SELECT postgis_full_version();"

      - name: Tests unitarios y de integración con cobertura
        run: uv run pytest --cov --cov-report=term-missing
