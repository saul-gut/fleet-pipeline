[project]
name = "fleet-pipeline"
version = "0.1.0"
description = "Pipeline geoespacial de telemetría vehicular (Bronce / Plata / Oro) sobre PostGIS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · UP: sintaxis moderna · SIM: simplificaciones
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
