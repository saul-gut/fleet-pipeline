[project]
name = "fleet-pipeline"
version = "0.1.0"
description = "Pipeline geoespacial de telemetría vehicular (Bronce / Plata / Oro) sobre PostGIS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
prep = [
    "geopandas>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · UP: sintaxis moderna · SIM: simplificaciones
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere PostGIS corriendo (docker compose up -d)"]

[tool.coverage.run]
source = ["fleet_pipeline"]

[tool.coverage.report]
# La lógica crítica (calidad, reglas de Plata, seguridad, ingesta) está al 100 %; los puntos de
# entrada de línea de comandos y el envío por red del simulador se prueban de punta a punta.
fail_under = 80
show_missing = true
skip_covered = true
