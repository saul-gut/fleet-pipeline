[theme]
base = "dark"
# Verde para los controles activos (selecciones, interruptores, etiquetas elegidas).
primaryColor = "#22c55e"
backgroundColor = "#0f141c"
secondaryBackgroundColor = "#1d2431"
textColor = "#f0efec"

[server]
headless = true
# Solo localhost: no depende de cambios en la red Wi-Fi del computador.
address = "127.0.0.1"

[browser]
gatherUsageStats = false
